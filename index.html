<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>VIP 資源總庫管理控制台 - 博主歸類與雲端清單</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #182234;
      --bg-hover: #334155;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-green: #34d399;
      --accent-purple: #c084fc;
      --accent-amber: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 24px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
      padding: 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-muted);
    }

    .stat-badge strong {
      color: var(--accent-blue);
      font-weight: 700;
    }

    /* 篩選與控制面板 */
    .filter-section {
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 16px;
    }

    .filter-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-select, .filter-input {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .filter-select:focus, .filter-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .filter-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    /* 檢視模式切換 Tab */
    .view-mode-toggle {
      display: inline-flex;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .view-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .view-tab.active {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    /* 清單主容器 */
    .list-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ===== 模式 A：博主歸類聚合卡片 (Grouped Accordion) ===== */
    .blogger-group-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .blogger-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: border-color 0.2s;
    }

    .blogger-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* 博主聚合主列 Header */
    .blogger-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.8) 0%, rgba(24, 34, 52, 0.8) 100%);
      transition: background 0.2s;
    }

    .blogger-header:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .blogger-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .blogger-avatar {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .blogger-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .blogger-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .blogger-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .count-pill {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .count-pill.multi {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .blogger-sub-desc {
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .blogger-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* 快速網址框 (外露於卡片) */
    .quick-pikpak-bar {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 12px;
      border-radius: 8px;
      gap: 8px;
      max-width: 280px;
    }

    .quick-url-text {
      font-family: monospace;
      font-size: 12px;
      color: var(--accent-blue);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 140px;
    }

    .btn-expand-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-expand-toggle:hover {
      background: var(--bg-hover);
      border-color: var(--accent-blue);
    }

    .arrow-icon {
      transition: transform 0.25s ease;
      font-size: 12px;
    }

    .blogger-card.expanded .arrow-icon {
      transform: rotate(180deg);
    }

    /* 展開後的子項目清單 */
    .blogger-sub-items {
      display: none;
      border-top: 1px solid var(--border-color);
      background: #111a2c;
    }

    .blogger-card.expanded .blogger-sub-items {
      display: block;
    }

    .sub-item-row {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s;
    }

    .sub-item-row:last-child {
      border-bottom: none;
    }

    .sub-item-row:hover {
      background: rgba(255,255,255,0.02);
    }

    .sub-item-left {
      flex: 1;
      min-width: 0;
    }

    .sub-item-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .sub-item-title:hover {
      color: var(--accent-blue);
    }

    .sub-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .sub-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ===== 通用徽章與按鈕 ===== */
    .badge-platform {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-type {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(192, 132, 252, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(192, 132, 252, 0.3);
    }

    .badge-source {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-copy {
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-copy.copied {
      background: var(--accent-green);
    }

    .code-tag {
      font-family: monospace;
      font-size: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--accent-amber);
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-view-detail {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-view-detail:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    /* ===== 模式 B：平鋪表格樣式 (Flat Table) ===== */
    .table-wrapper {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.data-table th {
      background: #182234;
      padding: 12px 16px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    table.data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: middle;
    }

    table.data-table tr:hover {
      background: rgba(56, 189, 248, 0.03);
    }

    .cover-thumb-sm {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #0f172a;
    }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* 詳情彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--bg-panel);
      z-index: 10;
    }

    .modal-pikpak-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
      border: 1px solid var(--accent-blue);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .modal-url-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
    }

    .modal-img-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .modal-img-grid img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .raw-text-box {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
    }

    /* 提示 Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-green);
      color: #0f172a;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      transition: transform 0.3s ease;
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 768px) {
      .blogger-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .blogger-right {
        width: 100%;
        justify-content: space-between;
      }
      .quick-pikpak-bar {
        max-width: 100%;
        flex: 1;
      }
      .quick-url-text {
        width: auto;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部管理標題欄 -->
  <header>
    <div class="header-content">
      <div class="brand">
        <div class="brand-icon">📁</div>
        <div>
          <div class="brand-title">VIP 資源總庫管理控制台</div>
          <div class="brand-subtitle">PikPak 雲端合集・依博主歸類清單</div>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-badge">全庫資源: <strong id="totalCount">0</strong> 部</div>
        <div class="stat-badge">獨立博主: <strong id="bloggerCount">0</strong> 位</div>
        <div class="stat-badge">當前顯示: <strong id="showingCount">0</strong> 位博主</div>
      </div>
    </div>
  </header>

  <!-- 三層級聯下拉篩選區 -->
  <section class="filter-section">
    <div class="filter-card">
      <div class="filter-grid">
        <!-- 下拉 1：平台 -->
        <div class="filter-group">
          <label class="filter-label" for="filterPlatform">
            <span>🌐 1. 平台分類</span>
          </label>
          <select id="filterPlatform" class="filter-select">
            <option value="ALL">全部平台 (All Platforms)</option>
          </select>
        </div>

        <!-- 下拉 2：類型 -->
        <div class="filter-group">
          <label class="filter-label" for="filterType">
            <span>🏷️ 2. 資源類型</span>
          </label>
          <select id="filterType" class="filter-select">
            <option value="ALL">全部類型 (All Types)</option>
          </select>
        </div>

        <!-- 下拉 3：博主 -->
        <div class="filter-group">
          <label class="filter-label" for="filterBlogger">
            <span>👤 3. 博主創作者</span>
          </label>
          <select id="filterBlogger" class="filter-select">
            <option value="ALL">全部博主 (All Creators)</option>
          </select>
        </div>

        <!-- 關鍵字快速檢索 -->
        <div class="filter-group">
          <label class="filter-label" for="filterKeyword">
            <span>🔍 關鍵字即時檢索</span>
          </label>
          <input type="text" id="filterKeyword" class="filter-input" placeholder="輸入博主名、標題、標籤...">
        </div>
      </div>

      <div class="filter-actions">
        <!-- 檢視模式切換 (依博主歸類 vs 全部平鋪) -->
        <div class="view-mode-toggle">
          <button id="tabGrouped" class="view-tab active">
            📁 依博主歸類聚合 (<span id="groupedBloggerCount">0</span> 位)
          </button>
          <button id="tabFlat" class="view-tab">
            📄 全部平鋪清單 (<span id="flatItemCount">0</span> 筆)
          </button>
        </div>

        <div style="display: flex; gap: 8px;">
          <button id="btnToggleAll" class="btn-action">
            <span>🔽</span> 全部展開/收合
          </button>
          <button id="btnResetFilters" class="btn-action">
            <span>🔄</span> 重設篩選
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 清單主區域 -->
  <main class="list-container">
    <!-- 檢視模式 1：依博主歸類聚合清單 (預設) -->
    <div id="groupedView" class="blogger-group-list">
      <!-- 動態渲染博主卡片 -->
    </div>

    <!-- 檢視模式 2：全部平鋪清單 -->
    <div id="flatView" class="table-wrapper" style="display: none;">
      <table class="data-table">
        <thead>
          <tr>
            <th>封面</th>
            <th>博主</th>
            <th>平台/類型</th>
            <th>合集標題</th>
            <th>☁️ PikPak 直連網址</th>
            <th>口令</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="flatTableBody">
          <!-- 平鋪清單 -->
        </tbody>
      </table>
    </div>

    <!-- 查無資料提示 -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div style="font-size: 40px; margin-bottom: 8px;">🔎</div>
      <h3>查無符合條件的資源</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">請嘗試放寬篩選選單或更換關鍵字。</p>
    </div>
  </main>

  <!-- 詳情彈窗 Modal -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-weight: 700;" id="modalTitle">資源詳情</div>
        <button id="btnCloseModal" style="background:transparent; border:none; color:var(--text-muted); font-size:22px; cursor:pointer;">&times;</button>
      </div>
      <div style="padding: 18px;">
        <div class="modal-pikpak-banner">
          <div style="font-size: 13px; font-weight:700; color:var(--accent-blue); margin-bottom:8px;">
            ☁️ PikPak 官方雲端直連網址：
          </div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="modalUrlInput" class="modal-url-input" readonly>
            <button class="btn-copy" id="btnModalCopyUrl">一鍵複製</button>
            <a href="#" target="_blank" id="btnModalOpenUrl" class="btn-copy" style="text-decoration:none; display:inline-flex; align-items:center;">開啟直連</a>
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
          <span class="badge-platform" id="modalPlatform">平台</span>
          <span class="badge-type" id="modalType">類型</span>
          <span class="badge-source" id="modalChannel">來源</span>
          <span class="code-tag" id="modalCodeBox">口令: -</span>
        </div>

        <h4 style="font-size: 13px; color:var(--text-muted); margin: 12px 0 6px;">寫真/封面套圖預覽：</h4>
        <div class="modal-img-grid" id="modalImagesGrid"></div>

        <h4 style="font-size: 13px; color:var(--text-muted); margin: 12px 0 6px;">來源頻道完整貼文：</h4>
        <div class="raw-text-box" id="modalRawText"></div>
      </div>
    </div>
  </div>

  <!-- 複製成功提示 -->
  <div id="toast" class="toast">✅ 已成功複製到剪貼簿！</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let allItems = [];
    let currentViewMode = 'grouped'; // 'grouped' 或 'flat'
    let allExpanded = false;

    // DOM 元素快取
    const filterPlatform = document.getElementById('filterPlatform');
    const filterType = document.getElementById('filterType');
    const filterBlogger = document.getElementById('filterBlogger');
    const filterKeyword = document.getElementById('filterKeyword');
    const btnResetFilters = document.getElementById('btnResetFilters');
    const btnToggleAll = document.getElementById('btnToggleAll');
    const tabGrouped = document.getElementById('tabGrouped');
    const tabFlat = document.getElementById('tabFlat');

    const groupedView = document.getElementById('groupedView');
    const flatView = document.getElementById('flatView');
    const flatTableBody = document.getElementById('flatTableBody');
    const emptyState = document.getElementById('emptyState');

    const totalCountEl = document.getElementById('totalCount');
    const bloggerCountEl = document.getElementById('bloggerCount');
    const showingCountEl = document.getElementById('showingCount');
    const groupedBloggerCountEl = document.getElementById('groupedBloggerCount');
    const flatItemCountEl = document.getElementById('flatItemCount');

    // 彈窗元素
    const detailModal = document.getElementById('detailModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalUrlInput = document.getElementById('modalUrlInput');
    const btnModalCopyUrl = document.getElementById('btnModalCopyUrl');
    const btnModalOpenUrl = document.getElementById('btnModalOpenUrl');
    const modalPlatform = document.getElementById('modalPlatform');
    const modalType = document.getElementById('modalType');
    const modalChannel = document.getElementById('modalChannel');
    const modalCodeBox = document.getElementById('modalCodeBox');
    const modalImagesGrid = document.getElementById('modalImagesGrid');
    const modalRawText = document.getElementById('modalRawText');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.innerText = msg || '✅ 已複製！';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyText(text, btnElement) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('✅ 已複製 PikPak 網址！');
          if (btnElement) {
            const original = btnElement.innerText;
            btnElement.innerText = '已複製!';
            btnElement.classList.add('copied');
            setTimeout(() => {
              btnElement.innerText = original;
              btnElement.classList.remove('copied');
            }, 1800);
          }
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ 已複製 PikPak 網址！');
      }
    }

    // 載入資料
    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json?t=' + Date.now(), { cache: 'no-store' });
        allItems = await res.json();
        
        allItems.forEach(item => {
          if (!item.platform) item.platform = item.category || '其他平台';
          if (!item.content_type) item.content_type = '完整合集';
          if (!item.blogger) item.blogger = '精選創作者';
        });

        const uniqueBloggers = new Set(allItems.map(x => x.blogger));
        totalCountEl.innerText = allItems.length;
        bloggerCountEl.innerText = uniqueBloggers.size;

        initDropdowns();
        applyFilters();
      } catch (err) {
        console.error('載入失敗:', err);
      }
    }

    // 初始化下拉選項
    function initDropdowns() {
      const platforms = [...new Set(allItems.map(x => x.platform))].sort();
      filterPlatform.innerHTML = '<option value="ALL">全部平台 (All Platforms)</option>';
      platforms.forEach(p => {
        const count = allItems.filter(x => x.platform === p).length;
        filterPlatform.innerHTML += `<option value="${p}">${p} (${count})</option>`;
      });

      updateTypeDropdown();
      updateBloggerDropdown();
    }

    function updateTypeDropdown() {
      const selectedPlatform = filterPlatform.value;
      const currentSelectedType = filterType.value;

      let items = allItems;
      if (selectedPlatform !== 'ALL') {
        items = items.filter(x => x.platform === selectedPlatform);
      }

      const types = [...new Set(items.map(x => x.content_type))].sort();
      filterType.innerHTML = '<option value="ALL">全部類型 (All Types)</option>';
      types.forEach(t => {
        const count = items.filter(x => x.content_type === t).length;
        filterType.innerHTML += `<option value="${t}">${t} (${count})</option>`;
      });

      if (types.includes(currentSelectedType)) {
        filterType.value = currentSelectedType;
      } else {
        filterType.value = 'ALL';
      }

      updateBloggerDropdown();
    }

    function updateBloggerDropdown() {
      const selectedPlatform = filterPlatform.value;
      const selectedType = filterType.value;
      const currentSelectedBlogger = filterBlogger.value;

      let items = allItems;
      if (selectedPlatform !== 'ALL') {
        items = items.filter(x => x.platform === selectedPlatform);
      }
      if (selectedType !== 'ALL') {
        items = items.filter(x => x.content_type === selectedType);
      }

      const bloggers = [...new Set(items.map(x => x.blogger))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
      filterBlogger.innerHTML = '<option value="ALL">全部博主 (All Creators)</option>';
      bloggers.forEach(b => {
        const count = items.filter(x => x.blogger === b).length;
        filterBlogger.innerHTML += `<option value="${b}">${b} (${count})</option>`;
      });

      if (bloggers.includes(currentSelectedBlogger)) {
        filterBlogger.value = currentSelectedBlogger;
      } else {
        filterBlogger.value = 'ALL';
      }
    }

    // 核心篩選與分組邏輯
    function applyFilters() {
      const p = filterPlatform.value;
      const t = filterType.value;
      const b = filterBlogger.value;
      const kw = filterKeyword.value.trim().toLowerCase();

      // 1. 篩選符合條件的所有單篇資源
      const filtered = allItems.filter(item => {
        if (p !== 'ALL' && item.platform !== p) return false;
        if (t !== 'ALL' && item.content_type !== t) return false;
        if (b !== 'ALL' && item.blogger !== b) return false;
        if (kw) {
          const matchStr = `${item.title} ${item.blogger} ${item.platform} ${item.content_type} ${(item.tags||[]).join(' ')} ${item.raw_text}`.toLowerCase();
          if (!matchStr.includes(kw)) return false;
        }
        return true;
      });

      // 2. 依照博主歸類聚合 (Group by Blogger)
      const bloggerMap = new Map();
      filtered.forEach(item => {
        const bloggerName = item.blogger;
        if (!bloggerMap.has(bloggerName)) {
          bloggerMap.set(bloggerName, []);
        }
        bloggerMap.get(bloggerName).push(item);
      });

      // 依照資源數量由多到少排序博主
      const sortedBloggerGroups = [...bloggerMap.entries()].sort((a, b) => b[1].length - a[1].length);

      // 更新看板數據
      showingCountEl.innerText = sortedBloggerGroups.length;
      groupedBloggerCountEl.innerText = sortedBloggerGroups.length;
      flatItemCountEl.innerText = filtered.length;

      if (sortedBloggerGroups.length === 0) {
        groupedView.innerHTML = '';
        flatTableBody.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      // 3. 渲染兩種模式
      renderGroupedView(sortedBloggerGroups);
      renderFlatView(filtered);
    }

    // 渲染模式 A：依博主歸類聚合卡片清單
    function renderGroupedView(groups) {
      let html = '';

      groups.forEach(([blogger, items]) => {
        const count = items.length;
        const mainItem = items[0]; // 最新的主項目
        const coverSrc = mainItem.cover_url || (mainItem.images && mainItem.images[0]) || '';
        const platforms = [...new Set(items.map(x => x.platform))];
        const isMulti = count > 1;

        const mainShareUrl = mainItem.pikpak_url || '';
        const mainShortUrl = mainShareUrl.replace('https://mypikpak.com/s/', '.../s/');
        const mainCode = mainItem.pikpak_code || blogger;

        html += `
          <div class="blogger-card ${allExpanded ? 'expanded' : ''}" id="group-${escapeId(blogger)}">
            <!-- 博主主列 (點擊切換展開/收合) -->
            <div class="blogger-header" onclick="toggleBloggerCard('${escapeId(blogger)}')">
              <div class="blogger-left">
                ${coverSrc ? `<img src="${coverSrc}" class="blogger-avatar" alt="${escapeHtml(blogger)}">` : '<div class="blogger-avatar"></div>'}
                <div class="blogger-info">
                  <div class="blogger-name-row">
                    <span class="blogger-title-text">👤 ${escapeHtml(blogger)}</span>
                    <span class="count-pill ${isMulti ? 'multi' : ''}">
                      ${isMulti ? `🔥 收錄 ${count} 部合集` : `共 1 部合集`}
                    </span>
                    ${platforms.map(p => `<span class="badge-platform">${escapeHtml(p)}</span>`).join('')}
                  </div>
                  <div class="blogger-sub-desc">
                    最新收錄：${escapeHtml(mainItem.title)}
                  </div>
                </div>
              </div>

              <!-- 右側操作與快速連結 -->
              <div class="blogger-right" onclick="event.stopPropagation()">
                <div class="quick-pikpak-bar" title="最新合集網址: ${mainShareUrl}">
                  <a href="${mainShareUrl}" target="_blank" class="quick-url-text">
                    ☁️ ${escapeHtml(mainShortUrl || mainShareUrl)}
                  </a>
                  <button class="btn-copy" onclick="copyText('${mainShareUrl}', this)">複製網址</button>
                </div>
                ${isMulti ? `
                  <button class="btn-expand-toggle" onclick="toggleBloggerCard('${escapeId(blogger)}')">
                    <span>展開清單 (${count})</span>
                    <span class="arrow-icon">▼</span>
                  </button>
                ` : `
                  <button class="btn-view-detail" onclick="openDetail(${mainItem.id})">詳情</button>
                `}
              </div>
            </div>

            <!-- 歸類於此博主的子項目合集清單 (展開後呈現) -->
            <div class="blogger-sub-items">
              ${items.map((sub, idx) => {
                const subUrl = sub.pikpak_url || '';
                const subShort = subUrl.replace('https://mypikpak.com/s/', '.../s/');
                const subCode = sub.pikpak_code || sub.blogger;
                return `
                  <div class="sub-item-row">
                    <div class="sub-item-left">
                      <div class="sub-item-title" onclick="openDetail(${sub.id})">
                        【第 ${items.length - idx} 部】${escapeHtml(sub.title)}
                      </div>
                      <div class="sub-item-meta">
                        <span class="badge-type">${escapeHtml(sub.content_type)}</span>
                        <span class="badge-source">來源: ${escapeHtml(sub.source_channel_name || '精品收藏')}</span>
                        ${sub.video_count ? `<span>🎬 ${sub.video_count} 影片</span>` : ''}
                        ${sub.photo_count ? `<span>📸 ${sub.photo_count} 寫真</span>` : ''}
                        <span>🔑 口令: <code class="code-tag" onclick="copyText('${subCode}', null)">${escapeHtml(subCode)}</code></span>
                      </div>
                    </div>
                    <div class="sub-item-right">
                      <div class="quick-pikpak-bar">
                        <a href="${subUrl}" target="_blank" class="quick-url-text" title="${subUrl}">
                          ☁️ ${escapeHtml(subShort)}
                        </a>
                        <button class="btn-copy" onclick="copyText('${subUrl}', this)">複製</button>
                      </div>
                      <button class="btn-view-detail" onclick="openDetail(${sub.id})">詳情</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      groupedView.innerHTML = html;
    }

    // 渲染模式 B：平鋪清單
    function renderFlatView(items) {
      let html = '';
      items.forEach(item => {
        const coverSrc = item.cover_url || (item.images && item.images[0]) || '';
        const shareUrl = item.pikpak_url || '';
        const shortUrl = shareUrl.replace('https://mypikpak.com/s/', '.../s/');
        const code = item.pikpak_code || item.blogger || '-';

        html += `
          <tr>
            <td>
              ${coverSrc ? `<img src="${coverSrc}" class="cover-thumb-sm" onclick="openDetail(${item.id})">` : ''}
            </td>
            <td><strong>${escapeHtml(item.blogger)}</strong></td>
            <td>
              <span class="badge-platform">${escapeHtml(item.platform)}</span>
              <span class="badge-type">${escapeHtml(item.content_type)}</span>
            </td>
            <td style="max-width:320px;">
              <div style="font-weight:600; cursor:pointer;" onclick="openDetail(${item.id})">${escapeHtml(item.title)}</div>
            </td>
            <td>
              <div class="quick-pikpak-bar">
                <a href="${shareUrl}" target="_blank" class="quick-url-text">${escapeHtml(shortUrl)}</a>
                <button class="btn-copy" onclick="copyText('${shareUrl}', this)">複製</button>
              </div>
            </td>
            <td><code class="code-tag" onclick="copyText('${code}', null)">${escapeHtml(code)}</code></td>
            <td><button class="btn-view-detail" onclick="openDetail(${item.id})">詳情</button></td>
          </tr>
        `;
      });
      flatTableBody.innerHTML = html;
    }

    // 切換展開/收合卡片
    window.toggleBloggerCard = function(escapedBlogger) {
      const card = document.getElementById(`group-${escapedBlogger}`);
      if (card) {
        card.classList.toggle('expanded');
      }
    };

    // 開啟詳情彈窗
    window.openDetail = function(id) {
      const item = allItems.find(x => x.id === id);
      if (!item) return;

      modalTitle.innerText = item.title;
      modalUrlInput.value = item.pikpak_url || '';
      btnModalOpenUrl.href = item.pikpak_url || '#';

      btnModalCopyUrl.onclick = () => copyText(item.pikpak_url, btnModalCopyUrl);

      modalPlatform.innerText = item.platform;
      modalType.innerText = item.content_type;
      modalChannel.innerText = `來源：${item.source_channel_name || '精品收藏'}`;
      modalCodeBox.innerText = `🔑 口令：${item.pikpak_code || item.blogger}`;

      modalImagesGrid.innerHTML = '';
      const imgs = item.images && item.images.length > 0 ? item.images : (item.cover_url ? [item.cover_url] : []);
      imgs.forEach(src => {
        modalImagesGrid.innerHTML += `<img src="${src}" onclick="window.open('${src}')" alt="preview">`;
      });

      modalRawText.innerText = item.raw_text || item.description || '無詳細文字備註';
      detailModal.classList.add('active');
    };

    btnCloseModal.onclick = () => detailModal.classList.remove('active');
    detailModal.onclick = (e) => {
      if (e.target === detailModal) detailModal.classList.remove('active');
    };

    // 檢視模式切換
    tabGrouped.onclick = () => {
      tabGrouped.classList.add('active');
      tabFlat.classList.remove('active');
      groupedView.style.display = 'flex';
      flatView.style.display = 'none';
      currentViewMode = 'grouped';
    };

    tabFlat.onclick = () => {
      tabFlat.classList.add('active');
      tabGrouped.classList.remove('active');
      groupedView.style.display = 'none';
      flatView.style.display = 'block';
      currentViewMode = 'flat';
    };

    // 一鍵展開/收合所有博主
    btnToggleAll.onclick = () => {
      allExpanded = !allExpanded;
      btnToggleAll.innerHTML = allExpanded ? '<span>🔼</span> 全部收合' : '<span>🔽</span> 全部展開';
      document.querySelectorAll('.blogger-card').forEach(card => {
        if (allExpanded) card.classList.add('expanded');
        else card.classList.remove('expanded');
      });
    };

    // 下拉事件
    filterPlatform.addEventListener('change', () => {
      updateTypeDropdown();
      applyFilters();
    });

    filterType.addEventListener('change', () => {
      updateBloggerDropdown();
      applyFilters();
    });

    filterBlogger.addEventListener('change', () => {
      applyFilters();
    });

    filterKeyword.addEventListener('input', () => {
      applyFilters();
    });

    btnResetFilters.addEventListener('click', () => {
      filterPlatform.value = 'ALL';
      updateTypeDropdown();
      filterType.value = 'ALL';
      updateBloggerDropdown();
      filterBlogger.value = 'ALL';
      filterKeyword.value = '';
      applyFilters();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeId(str) {
      return encodeURIComponent(str || '').replace(/%/g, '_');
    }

    loadCatalog();
  </script>
</body>
</html>
