<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>身心保健 ｜ 專屬福利資源庫</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              neon: '#ec4899',
              of: '#00aff0',
              dark: '#0b0f19',
              card: '#131b2e',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    video {
      background-color: #000;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- 頂部導航與標題 -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/95 backdrop-blur-md border-b border-brand-border px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full gold-gradient flex items-center justify-center font-black text-black text-sm shadow-lg shadow-amber-500/20">
          🔞
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-wide">身心保健・專屬資源庫</h1>
          <p class="text-[11px] text-zinc-400">每日 4K 無碼原片・在線秒播試看</p>
        </div>
      </div>
      <a href="https://t.me/+BOERCyv4q7Y1NzM1" target="_blank" class="px-2.5 py-1 text-xs rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">
        大本營 ↗
      </a>
    </div>

    <!-- 搜索欄 -->
    <div class="mt-3 relative">
      <input type="text" id="searchInput" placeholder="搜尋 模特名、OnlyFans、MyFans、標籤..." 
             class="w-full bg-[#131b2e] border border-brand-border rounded-xl px-9 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition-all">
      <svg class="w-4 h-4 text-zinc-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <button id="clearSearch" class="hidden absolute right-3 top-2 text-xs text-zinc-400 hover:text-white">✕</button>
    </div>

    <!-- 頂部清晰分類導航 (OnlyFans / MyFans / 推特 / 秀人 / 其他平台) -->
    <div class="mt-2.5 flex space-x-2 overflow-x-auto custom-scroll py-1" id="tagPills">
      <button data-tag="ALL" class="tag-pill active px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-black shadow-md shadow-amber-500/20 flex-shrink-0 flex items-center gap-1">
        <span>🔥</span> 全部精選
      </button>
      <button data-tag="OnlyFans" class="tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#00aff0]/15 text-[#00aff0] border border-[#00aff0]/40 flex-shrink-0 flex items-center gap-1 shadow-sm">
        <span>💎</span> OnlyFans
      </button>
      <button data-tag="MyFans" class="tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#ec4899]/15 text-[#ec4899] border border-[#ec4899]/40 flex-shrink-0 flex items-center gap-1 shadow-sm">
        <span>🍒</span> MyFans
      </button>
      <button data-tag="推特" class="tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#1d9bf0]/15 text-[#1d9bf0] border border-[#1d9bf0]/40 flex-shrink-0 flex items-center gap-1 shadow-sm">
        <span>🐦</span> 推特
      </button>
      <button data-tag="秀人寫真" class="tag-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#131b2e] text-zinc-300 border border-brand-border flex-shrink-0 flex items-center gap-1">
        <span>👑</span> 秀人寫真
      </button>
      <button data-tag="其他平台" class="tag-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#131b2e] text-zinc-300 border border-brand-border flex-shrink-0 flex items-center gap-1">
        <span>📦</span> 其他平台
      </button>
    </div>
  </header>

  <!-- 置頂提示橫幅 (無廣告純享) -->
  <section class="px-4 mt-3">
    <div class="glass-card rounded-2xl p-3 border border-amber-500/20 bg-gradient-to-r from-amber-500/10 via-rose-500/5 to-transparent flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-base">
          🎬
        </div>
        <div>
          <div class="text-xs font-bold text-amber-300">高清在線試看專區</div>
          <div class="text-[11px] text-zinc-400">點擊任意卡片即可在線播放片段・找完整版請善用極搜</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 內容網格列表 -->
  <main class="px-4 mt-4">
    <div class="flex items-center justify-between mb-2.5">
      <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        實時上架資源 (<span id="itemCount">0</span>)
      </h2>
      <span class="text-[11px] text-zinc-500">支援在線試看・原畫無碼</span>
    </div>

    <!-- 雙列海報網格 -->
    <div id="gridContainer" class="grid grid-cols-2 gap-2.5 sm:gap-3.5">
      <!-- 卡片由 JS 動態注入 -->
    </div>

    <!-- 空狀態 -->
    <div id="emptyState" class="hidden py-16 text-center text-zinc-500">
      <div class="text-3xl mb-2">🔍</div>
      <p class="text-xs">找不到相關資源，換個關鍵詞或切換標籤試試吧！</p>
    </div>
  </main>

  <!-- 詳情與影片在線播放彈窗 (Video Player Modal) -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="w-full max-w-lg bg-[#131b2e] rounded-t-3xl sm:rounded-3xl border border-brand-border overflow-hidden max-h-[92vh] flex flex-col shadow-2xl">
      
      <!-- 頂部視訊播放器區 -->
      <div class="relative w-full aspect-video bg-black flex items-center justify-center overflow-hidden">
        <!-- 原生 HTML5 播放器 (100% 相容各終端，支援手動點擊秒播) -->
        <video id="modalVideoPlayer" 
               class="w-full h-full object-contain bg-black" 
               controls 
               playsinline 
               webkit-playsinline 
               preload="metadata">
        </video>
        
        <button id="closeModal" class="absolute top-3 right-3 z-30 w-8 h-8 rounded-full bg-black/70 text-white flex items-center justify-center text-sm border border-white/20 shadow-lg">✕</button>
      </div>

      <!-- 詳情內文 -->
      <div class="p-4 overflow-y-auto custom-scroll space-y-3 flex-1">
        <div>
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/30" id="modalCategory">分類</span>
            <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">⚡ 支援在線試看</span>
          </div>
          <h3 class="text-sm font-bold text-white leading-snug" id="modalTitle">標題載入中...</h3>
          <div class="flex items-center space-x-2 mt-1">
            <span class="text-xs text-amber-400 font-semibold" id="modalBlogger">模特名</span>
            <span class="text-zinc-600">•</span>
            <span class="text-[11px] text-zinc-400" id="modalTime">2026-11-10</span>
          </div>
        </div>

        <div class="bg-black/40 rounded-xl p-3 border border-white/5">
          <div class="text-[11px] text-zinc-400 font-medium mb-1">私密看點：</div>
          <p class="text-xs text-zinc-300 leading-relaxed" id="modalDesc"></p>
        </div>

        <div>
          <div class="text-[11px] text-zinc-400 mb-1.5 font-medium">標籤分類：</div>
          <div class="flex flex-wrap gap-1.5" id="modalTags"></div>
        </div>

        <!-- 試看提示橫幅 -->
        <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 text-[11px] text-amber-300/90 flex items-start gap-2">
          <span>💡</span>
          <div>
            上面窗口正在播放高清在線預覽片段。若想獲取該博主<b>完整無碼長篇（數 GB 高清原檔）</b>，請點擊下方按鈕直接開啟極搜！
          </div>
        </div>
      </div>

      <!-- 底部行動按鈕區 -->
      <div class="p-3 bg-[#0b0f19] border-t border-brand-border space-y-2">
        <button id="btnJisou" 
           class="w-full py-3 rounded-xl gold-gradient text-black font-black text-xs flex items-center justify-center space-x-1.5 shadow-lg shadow-amber-500/20 active:scale-95 transition-transform">
          <span>🔍 極搜查同款完整版（點此複製搜詞並開啟）</span>
        </button>
        <a href="https://t.me/+BOERCyv4q7Y1NzM1" target="_blank" 
           class="block w-full py-2.5 rounded-xl bg-[#1e293b] text-zinc-300 text-center text-xs font-medium border border-white/5 hover:text-white">
          💬 加入官方交流討論大本營防失聯 ↗
        </a>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-black/90 border border-white/20 text-white text-xs px-4 py-2 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
    已成功複製！
  </div>

  <!-- 業務邏輯腳本 -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor('#0b0f19');
        tg.setBackgroundColor('#0b0f19');
      } catch(e) {}
    }

    let catalogData = [];
    let currentFilterTag = 'ALL';
    let currentActiveItem = null;

    function haptic() {
      try {
        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json?' + new Date().getTime());
        catalogData = await res.json();
      } catch (e) {
        console.warn('載入 catalog.json 失敗');
      }
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      const empty = document.getElementById('emptyState');
      const countEl = document.getElementById('itemCount');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      container.innerHTML = '';

      const filtered = catalogData.filter(item => {
        let matchTag = false;
        if (currentFilterTag === 'ALL') {
          matchTag = true;
        } else if (currentFilterTag === 'OnlyFans') {
          matchTag = (item.category === 'OnlyFans') || 
            (item.tags && item.tags.some(t => /onlyfans|fansly|of/i.test(t))) ||
            /onlyfans|fansly/i.test(item.title);
        } else if (currentFilterTag === 'MyFans') {
          matchTag = (item.category === 'MyFans') || 
            (item.tags && item.tags.some(t => /myfans|candfans|fantia|fc2/i.test(t))) ||
            /myfans|candfans|fc2/i.test(item.title);
        } else if (currentFilterTag === '推特') {
          matchTag = (item.category === '推特') || 
            (item.tags && item.tags.some(t => /推特|twitter|推友/i.test(t))) ||
            /推特|twitter/i.test(item.title);
        } else if (currentFilterTag === '秀人寫真') {
          matchTag = (item.category === '秀人寫真') || 
            (item.tags && item.tags.some(t => /秀人|蜜桃|尤果/i.test(t))) ||
            /秀人|蜜桃/i.test(item.title);
        } else if (currentFilterTag === '其他平台') {
          matchTag = (item.category === '其他平台') || 
            (item.tags && item.tags.some(t => /其他|合集|91|麻豆/i.test(t))) ||
            /合集|91/i.test(item.title);
        } else {
          matchTag = (item.category === currentFilterTag) || 
            (item.tags && item.tags.some(t => t.includes(currentFilterTag))) ||
            (item.blogger && item.blogger.includes(currentFilterTag));
        }

        const matchQuery = !query || 
          item.title.toLowerCase().includes(query) ||
          item.blogger.toLowerCase().includes(query) ||
          (item.tags && item.tags.some(t => t.toLowerCase().includes(query))) ||
          item.preview_desc.toLowerCase().includes(query);

        return matchTag && matchQuery;
      });

      countEl.innerText = filtered.length;

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "group glass-card rounded-2xl p-2.5 border border-brand-border hover:border-amber-500/40 transition-all cursor-pointer flex flex-col justify-between";
        card.onclick = () => openDetail(item);

        let badgeLabel = item.blogger || '精選';
        let badgeColor = 'bg-amber-400/20 text-amber-300 border-amber-400/30';

        if (item.category === 'OnlyFans') {
          badgeLabel = '💎 OnlyFans';
          badgeColor = 'bg-[#00aff0]/20 text-[#00aff0] border-[#00aff0]/30';
        } else if (item.category === 'MyFans') {
          badgeLabel = '🍒 MyFans';
          badgeColor = 'bg-[#ec4899]/20 text-[#ec4899] border-[#ec4899]/30';
        } else if (item.category === '推特') {
          badgeLabel = '🐦 推特';
          badgeColor = 'bg-[#1d9bf0]/20 text-[#1d9bf0] border-[#1d9bf0]/30';
        } else if (item.category === '秀人寫真') {
          badgeLabel = '👑 秀人';
          badgeColor = 'bg-amber-400/20 text-amber-300 border-amber-400/30';
        } else if (item.category === '其他平台') {
          badgeLabel = '📦 其他平台';
          badgeColor = 'bg-purple-500/20 text-purple-300 border-purple-500/30';
        }

        const coverSrc = item.cover_url || '';
        const coverHtml = coverSrc ? `
          <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden mb-2 bg-slate-900 shadow-inner">
            <img src="${coverSrc}" 
                 alt="${item.title}" 
                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
                 loading="lazy"
                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-slate-800 text-xs text-zinc-500 font-bold\\'>4K 高清原片</div>';" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/20"></div>
            <span class="absolute top-1.5 left-1.5 text-[10px] font-bold ${badgeColor} backdrop-blur-md px-1.5 py-0.5 rounded border">
              ${badgeLabel}
            </span>
            <span class="absolute bottom-1.5 right-1.5 text-[9px] text-zinc-200 bg-black/80 backdrop-blur-md px-1 py-0.5 rounded font-mono">
              ${item.video_count > 1 ? `🎬 ${item.video_count}部合集` : '📹 在線試看'}
            </span>
          </div>
        ` : `
          <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden mb-2 bg-gradient-to-br from-indigo-950 via-slate-900 to-rose-950 flex items-center justify-center border border-white/5 shadow-inner">
            <span class="text-2xl">🔞</span>
            <span class="absolute top-1.5 left-1.5 text-[10px] font-bold ${badgeColor} backdrop-blur-md px-1.5 py-0.5 rounded border">
              ${badgeLabel}
            </span>
            <span class="absolute bottom-1.5 right-1.5 text-[9px] text-zinc-200 bg-black/80 backdrop-blur-md px-1 py-0.5 rounded font-mono">
              ${item.video_count > 1 ? `🎬 ${item.video_count}部` : '📹 在線試看'}
            </span>
          </div>
        `;

        card.innerHTML = `
          <div>
            ${coverHtml}
            <h3 class="text-xs font-bold text-white mb-1 line-clamp-1 leading-snug group-hover:text-amber-400 transition-colors">${item.title}</h3>
            <p class="text-[10px] text-zinc-400 line-clamp-1 mb-1.5">${item.preview_desc}</p>
          </div>
          <div class="pt-1.5 border-t border-white/5 flex items-center justify-between">
            <span class="text-[9px] text-zinc-500">${item.created_at || '最新'}</span>
            <span class="text-[10px] font-bold text-rose-400 flex items-center gap-0.5">
              <span>▶</span> 在線播放
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openDetail(item) {
      haptic();
      currentActiveItem = item;

      // 重置並加載播放器
      const player = document.getElementById('modalVideoPlayer');
      player.pause();
      player.poster = item.cover_url || '';
      player.src = item.video_url || 'sample.mp4';
      player.load();

      document.getElementById('modalCategory').innerText = item.category || '精選推薦';
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalBlogger').innerText = `博主：${item.blogger}`;
      document.getElementById('modalTime').innerText = item.created_at || '最新上架';
      document.getElementById('modalDesc').innerText = item.preview_desc;

      const tagsContainer = document.getElementById('modalTags');
      tagsContainer.innerHTML = (item.tags || []).map(t => 
        `<span class="text-[11px] px-2 py-0.5 rounded-full bg-white/5 text-zinc-300 border border-white/10">${t}</span>`
      ).join('');

      // 按鈕綁定
      const btnJisou = document.getElementById('btnJisou');
      btnJisou.onclick = (e) => {
        e.preventDefault();
        haptic();
        const kw = item.search_kw || item.blogger;
        navigator.clipboard.writeText(kw).then(() => {
          showToast(`已複製搜詞「${kw}」，正在開啟極搜...`);
          setTimeout(() => {
            window.open(item.jisou_url || "https://t.me/jisou2?start=a_1251504388", "_blank");
          }, 400);
        }).catch(() => {
          window.open(item.jisou_url || "https://t.me/jisou2?start=a_1251504388", "_blank");
        });
      };

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      haptic();
      const player = document.getElementById('modalVideoPlayer');
      player.pause();
      player.removeAttribute('src');
      player.load();
      document.getElementById('detailModal').classList.add('hidden');
    }

    document.getElementById('closeModal').onclick = closeModal;

    document.getElementById('detailModal').onclick = (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    };

    // 標籤切換
    document.querySelectorAll('.tag-pill').forEach(pill => {
      pill.onclick = () => {
        haptic();
        document.querySelectorAll('.tag-pill').forEach(p => {
          const tag = p.getAttribute('data-tag');
          if (tag === 'OnlyFans') {
            p.className = 'tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#00aff0]/15 text-[#00aff0] border border-[#00aff0]/40 flex-shrink-0 flex items-center gap-1 shadow-sm';
          } else if (tag === 'MyFans') {
            p.className = 'tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#ec4899]/15 text-[#ec4899] border border-[#ec4899]/40 flex-shrink-0 flex items-center gap-1 shadow-sm';
          } else if (tag === '推特') {
            p.className = 'tag-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#1d9bf0]/15 text-[#1d9bf0] border border-[#1d9bf0]/40 flex-shrink-0 flex items-center gap-1 shadow-sm';
          } else {
            p.className = 'tag-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#131b2e] text-zinc-300 border border-brand-border flex-shrink-0 flex items-center gap-1';
          }
        });

        pill.className = 'tag-pill active px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-black shadow-md shadow-amber-500/20 flex-shrink-0 flex items-center gap-1';

        currentFilterTag = pill.getAttribute('data-tag');
        renderGrid();
      };
    });

    // 搜索監聽
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearch');
    searchInput.oninput = () => {
      if (searchInput.value.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderGrid();
    };

    clearBtn.onclick = () => {
      haptic();
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderGrid();
    };

    // 初始載入
    loadCatalog();
  </script>
</body>
</html>
