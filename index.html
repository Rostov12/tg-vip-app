<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>身心保健 ｜ PikPak 雲端專屬資源庫</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              neon: '#ec4899',
              of: '#00aff0',
              pikpak: '#2563eb',
              dark: '#0b0f19',
              card: '#131b2e',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    .pikpak-gradient {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- 頂部導航與標題 -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/95 backdrop-blur-md border-b border-brand-border px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-black text-white text-sm shadow-lg shadow-blue-500/20">
          ☁️
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-wide">身心保健・PikPak 雲端專屬庫</h1>
          <p class="text-[11px] text-zinc-400">海量完整合集原檔・PikPak 網盤一鍵轉存秒播</p>
        </div>
      </div>
      <a href="https://t.me/shenxin_club" target="_blank" class="px-2.5 py-1 text-xs rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium hover:bg-blue-500/20 transition-colors">
        交流大本營 ↗
      </a>
    </div>

    <!-- 搜索欄 (支援標題、博主名、標籤、貼文內文全文檢索) -->
    <div class="mt-3 relative">
      <input type="text" id="searchInput" placeholder="搜尋 模特名、標籤、貼文內文關鍵詞..." 
             class="w-full bg-[#131b2e] border border-brand-border rounded-xl pl-9 pr-8 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition-all">
      <svg class="w-4 h-4 text-zinc-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <button id="clearSearch" class="hidden absolute right-3 top-2 text-xs text-zinc-400 hover:text-white">✕</button>
    </div>

    <!-- 主類別分類導航 (All / OnlyFans / MyFans / 推特 / 秀人 / 其他平台) -->
    <div class="mt-2.5 flex space-x-2 overflow-x-auto custom-scroll py-1" id="categoryPills">
      <button data-cat="ALL" class="cat-pill active px-3 py-1 rounded-full text-xs font-bold bg-blue-600 text-white shadow-md shadow-blue-600/30 flex-shrink-0 flex items-center gap-1">
        <span>🔥</span> 全部合集
      </button>
      <button data-cat="OnlyFans" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-[#00aff0] border border-[#00aff0]/30 flex-shrink-0 flex items-center gap-1">
        <span>💎</span> OnlyFans
      </button>
      <button data-cat="MyFans" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-[#ec4899] border border-[#ec4899]/30 flex-shrink-0 flex items-center gap-1">
        <span>🍒</span> MyFans
      </button>
      <button data-cat="推特" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-[#1d9bf0] border border-[#1d9bf0]/30 flex-shrink-0 flex items-center gap-1">
        <span>🐦</span> 推特
      </button>
      <button data-cat="秀人寫真" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-amber-400 border border-amber-400/30 flex-shrink-0 flex items-center gap-1">
        <span>👑</span> 秀人寫真
      </button>
      <button data-cat="其他平台" class="cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-purple-400 border border-purple-400/30 flex-shrink-0 flex items-center gap-1">
        <span>📦</span> 其他平台
      </button>
    </div>

    <!-- 熱門標籤快速篩選列 (動態生成) -->
    <div class="mt-2 flex space-x-1.5 overflow-x-auto custom-scroll py-0.5" id="tagPills">
      <!-- 由 JS 動態注入熱門標籤 -->
    </div>
  </header>

  <!-- 置頂提示橫幅 (PikPak 雲端專屬特性說明) -->
  <section class="px-4 mt-3">
    <div class="glass-card rounded-2xl p-3 border border-blue-500/20 bg-gradient-to-r from-blue-600/10 via-indigo-600/5 to-transparent flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-base">
          ⚡
        </div>
        <div>
          <div class="text-xs font-bold text-blue-300">PikPak 官方雲端直連庫</div>
          <div class="text-[11px] text-zinc-400">點擊卡片查看完整貼文與標籤，一鍵高速轉存個人網盤</div>
        </div>
      </div>
      <span class="text-[10px] text-zinc-400 bg-white/5 px-2 py-0.5 rounded-full border border-white/10" id="sourceBadge">來源：精品收藏</span>
    </div>
  </section>

  <!-- 內容網格列表 -->
  <main class="px-4 mt-4">
    <div class="flex items-center justify-between mb-2.5">
      <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
        已收錄網盤資源 (<span id="itemCount">0</span>)
      </h2>
      <span class="text-[11px] text-zinc-500">免下載・一鍵轉存秒播</span>
    </div>

    <!-- 雙列海報網格 -->
    <div id="gridContainer" class="grid grid-cols-2 gap-2.5 sm:gap-3.5">
      <!-- 卡片由 JS 動態注入 -->
    </div>

    <!-- 空狀態 -->
    <div id="emptyState" class="hidden py-16 text-center text-zinc-500">
      <div class="text-3xl mb-2">🔍</div>
      <p class="text-xs">找不到符合條件的資源，請換個關鍵詞或重置標籤！</p>
      <button onclick="resetFilters()" class="mt-3 px-3 py-1 rounded-full bg-blue-600/20 text-blue-400 text-xs border border-blue-500/30">
        重置所有篩選
      </button>
    </div>
  </main>

  <!-- 詳情彈窗 (Resource Detail Modal) -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="w-full max-w-lg bg-[#131b2e] rounded-t-3xl sm:rounded-3xl border border-brand-border overflow-hidden max-h-[92vh] flex flex-col shadow-2xl">
      
      <!-- 頂部寫真封面預覽區 (支援多圖預覽切換) -->
      <div class="relative w-full aspect-[16/10] bg-black flex items-center justify-center overflow-hidden">
        <img id="modalCover" src="" alt="資源封面" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#131b2e] via-transparent to-black/40"></div>
        
        <!-- 多圖預覽切換導航點 -->
        <div id="modalGalleryDots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex space-x-1.5 z-20"></div>

        <button id="closeModal" class="absolute top-3 right-3 z-30 w-8 h-8 rounded-full bg-black/70 text-white flex items-center justify-center text-sm border border-white/20 shadow-lg">✕</button>
      </div>

      <!-- 詳情內文 -->
      <div class="p-4 overflow-y-auto custom-scroll space-y-3 flex-1">
        <div>
          <div class="flex items-center gap-1.5 mb-1.5 flex-wrap">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 border border-blue-500/30" id="modalCategory">分類</span>
            <span class="text-[10px] text-zinc-300 bg-white/5 px-2 py-0.5 rounded-full border border-white/10" id="modalChannel">來源：精品收藏</span>
            <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20" id="modalSpec">📦 完整合集</span>
          </div>
          <h3 class="text-sm font-bold text-white leading-snug" id="modalTitle">標題載入中...</h3>
          <div class="flex items-center space-x-2 mt-1">
            <span class="text-xs text-blue-400 font-semibold" id="modalBlogger">博主名</span>
            <span class="text-zinc-600">•</span>
            <span class="text-[11px] text-zinc-400" id="modalTime">2026-11-10</span>
          </div>
        </div>

        <!-- ☁️ 專屬 PikPak 官方網盤直連專區 (醒目發光卡片) -->
        <div class="bg-gradient-to-r from-blue-950/80 via-slate-900 to-indigo-950/80 rounded-xl p-3 border-2 border-blue-500/50 shadow-lg shadow-blue-500/10 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-blue-300 flex items-center gap-1.5">
              <span class="text-base">☁️</span> <b>PikPak 雲端直連網址：</b>
            </span>
            <span class="text-[10px] bg-blue-500/20 text-blue-300 font-bold px-2 py-0.5 rounded-full border border-blue-400/30">
              ⚡ 原檔無碼・秒存秒播
            </span>
          </div>

          <!-- 網址顯示框（直接顯示完整 https://mypikpak.com/s/...） -->
          <div class="bg-black/80 rounded-lg p-2.5 border border-blue-500/30 flex items-center justify-between gap-2">
            <a id="modalPikPakLink" href="#" target="_blank" class="text-xs text-blue-400 font-mono underline truncate flex-1 hover:text-blue-200">
              載入中...
            </a>
            <button id="btnCopyUrlDirect" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold flex-shrink-0 transition-transform active:scale-95 shadow">
              📋 複製
            </button>
          </div>

          <!-- 提取碼 / 口令 -->
          <div class="flex items-center justify-between text-xs text-zinc-300 pt-1.5 border-t border-white/10">
            <div class="flex items-center gap-1.5">
              <span>🔑</span>
              <span>博主專屬提取口令：<b id="modalCode" class="text-amber-400 font-mono text-sm tracking-wide"></b></span>
            </div>
            <button id="btnCopyCode" class="px-2.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-zinc-200 text-[10px] font-medium border border-white/20">
              複製口令
            </button>
          </div>
        </div>

        <!-- 貼文完整內文展示區 -->
        <div class="bg-black/40 rounded-xl p-3 border border-white/5">
          <div class="text-[11px] text-zinc-400 font-medium mb-1 flex items-center justify-between">
            <span>📝 來源貼文完整內文：</span>
            <button id="btnCopyText" class="text-[10px] text-blue-400 hover:underline">複製內文</button>
          </div>
          <div class="text-xs text-zinc-200 leading-relaxed whitespace-pre-wrap font-sans" id="modalRawText"></div>
        </div>

        <!-- 標籤分類（點擊可直接篩選） -->
        <div>
          <div class="text-[11px] text-zinc-400 mb-1.5 font-medium">🏷️ 標籤分類（點擊直接篩選）：</div>
          <div class="flex flex-wrap gap-1.5" id="modalTags"></div>
        </div>
      </div>

      <!-- 底部核心行動按鈕區 -->
      <div class="p-3 bg-[#0b0f19] border-t border-brand-border space-y-2">
        <button id="btnPikPakDirect" 
           class="w-full py-3 rounded-xl pikpak-gradient text-white font-black text-xs flex items-center justify-center space-x-1.5 shadow-lg shadow-blue-600/30 active:scale-95 transition-transform">
          <span>🚀 一鍵轉存 PikPak 網盤（直連開啟）</span>
        </button>
        
        <div class="grid grid-cols-2 gap-2">
          <button id="btnCopyUrl" 
             class="py-2.5 rounded-xl bg-[#131b2e] text-zinc-300 text-center text-xs font-medium border border-white/10 hover:text-white">
            📋 複製網盤直連網址
          </button>
          <button id="btnJisouSearch" 
             class="py-2.5 rounded-xl bg-[#1e293b] text-amber-400 text-center text-xs font-medium border border-amber-500/20 hover:text-amber-300">
            🔍 極搜查全網同款
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-black/90 border border-white/20 text-white text-xs px-4 py-2 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
    已成功複製！
  </div>

  <!-- 業務邏輯腳本 -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor('#0b0f19');
        tg.setBackgroundColor('#0b0f19');
      } catch(e) {}
    }

    let catalogData = [];
    let currentCategory = 'ALL';
    let currentTag = 'ALL';
    let currentActiveItem = null;
    let popularTags = [];

    function haptic() {
      try {
        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // 載入資料
    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json?' + new Date().getTime());
        catalogData = await res.json();
      } catch (e) {
        console.warn('載入 catalog.json 失敗:', e);
      }
      buildTagList();
      renderGrid();
    }

    // 統計並建立熱門標籤列表
    function buildTagList() {
      const tagMap = {};
      catalogData.forEach(item => {
        (item.tags || []).forEach(t => {
          if (!t) return;
          const clean = t.trim();
          tagMap[clean] = (tagMap[clean] || 0) + 1;
        });
      });

      // 排序前 15 大熱門標籤
      popularTags = Object.entries(tagMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 16)
        .map(entry => entry[0]);

      const tagContainer = document.getElementById('tagPills');
      let html = `<button data-tag="ALL" class="tag-chip active px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/20 text-white flex-shrink-0">全部標籤</button>`;
      
      popularTags.forEach(t => {
        html += `<button data-tag="${t}" class="tag-chip px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 hover:text-white">${t}</button>`;
      });

      tagContainer.innerHTML = html;

      // 綁定標籤點擊事件
      tagContainer.querySelectorAll('.tag-chip').forEach(btn => {
        btn.onclick = () => {
          haptic();
          tagContainer.querySelectorAll('.tag-chip').forEach(b => {
            b.className = 'tag-chip px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 hover:text-white';
          });
          btn.className = 'tag-chip active px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/20 text-white flex-shrink-0';
          currentTag = btn.getAttribute('data-tag');
          renderGrid();
        };
      });
    }

    function resetFilters() {
      haptic();
      currentCategory = 'ALL';
      currentTag = 'ALL';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearch').classList.add('hidden');

      // 重置分類按鈕
      document.querySelectorAll('.cat-pill').forEach(p => {
        if (p.getAttribute('data-cat') === 'ALL') {
          p.className = 'cat-pill active px-3 py-1 rounded-full text-xs font-bold bg-blue-600 text-white shadow-md shadow-blue-600/30 flex-shrink-0 flex items-center gap-1';
        } else {
          p.className = 'cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 flex items-center gap-1';
        }
      });

      // 重置標籤按鈕
      const tagContainer = document.getElementById('tagPills');
      tagContainer.querySelectorAll('.tag-chip').forEach(b => {
        if (b.getAttribute('data-tag') === 'ALL') {
          b.className = 'tag-chip active px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/20 text-white flex-shrink-0';
        } else {
          b.className = 'tag-chip px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 hover:text-white';
        }
      });

      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      const empty = document.getElementById('emptyState');
      const countEl = document.getElementById('itemCount');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      container.innerHTML = '';

      const filtered = catalogData.filter(item => {
        // 1. 平台分類篩選
        let matchCat = false;
        if (currentCategory === 'ALL') {
          matchCat = true;
        } else if (currentCategory === 'OnlyFans') {
          matchCat = (item.category === 'OnlyFans') || 
            (item.tags && item.tags.some(t => /onlyfans|fansly/i.test(t))) ||
            /onlyfans|fansly/i.test(item.title);
        } else if (currentCategory === 'MyFans') {
          matchCat = (item.category === 'MyFans') || 
            (item.tags && item.tags.some(t => /myfans|candfans|fantia|fc2/i.test(t))) ||
            /myfans|candfans|fc2/i.test(item.title);
        } else if (currentCategory === '推特') {
          matchCat = (item.category === '推特') || 
            (item.tags && item.tags.some(t => /推特|twitter|推友/i.test(t))) ||
            /推特|twitter/i.test(item.title);
        } else if (currentCategory === '秀人寫真') {
          matchCat = (item.category === '秀人寫真') || 
            (item.tags && item.tags.some(t => /秀人|蜜桃|尤果/i.test(t))) ||
            /秀人|蜜桃/i.test(item.title);
        } else if (currentCategory === '其他平台') {
          matchCat = (item.category === '其他平台') || 
            (item.tags && item.tags.some(t => /其他|合集|pornhub|sp站|st站/i.test(t))) ||
            /pornhub|合集/i.test(item.title);
        } else {
          matchCat = (item.category === currentCategory);
        }

        // 2. 標籤篩選
        let matchTag = true;
        if (currentTag !== 'ALL') {
          matchTag = item.tags && item.tags.some(t => t.toLowerCase() === currentTag.toLowerCase());
        }

        // 3. 關鍵字搜尋 (標題、博主、標籤、貼文內文全文)
        let matchQuery = true;
        if (query) {
          const tMatch = item.title && item.title.toLowerCase().includes(query);
          const bMatch = item.blogger && item.blogger.toLowerCase().includes(query);
          const tagMatch = item.tags && item.tags.some(t => t.toLowerCase().includes(query));
          const textMatch = item.raw_text && item.raw_text.toLowerCase().includes(query);
          const descMatch = item.description && item.description.toLowerCase().includes(query);
          matchQuery = tMatch || bMatch || tagMatch || textMatch || descMatch;
        }

        return matchCat && matchTag && matchQuery;
      });

      countEl.innerText = filtered.length;

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "group glass-card rounded-2xl p-2.5 border border-brand-border hover:border-blue-500/50 transition-all cursor-pointer flex flex-col justify-between";
        card.onclick = () => openDetail(item);

        let badgeLabel = item.category || '合集';
        let badgeColor = 'bg-blue-500/20 text-blue-300 border-blue-400/30';

        if (item.category === 'OnlyFans') {
          badgeLabel = '💎 OnlyFans';
          badgeColor = 'bg-[#00aff0]/20 text-[#00aff0] border-[#00aff0]/30';
        } else if (item.category === 'MyFans') {
          badgeLabel = '🍒 MyFans';
          badgeColor = 'bg-[#ec4899]/20 text-[#ec4899] border-[#ec4899]/30';
        } else if (item.category === '推特') {
          badgeLabel = '🐦 推特';
          badgeColor = 'bg-[#1d9bf0]/20 text-[#1d9bf0] border-[#1d9bf0]/30';
        } else if (item.category === '秀人寫真') {
          badgeLabel = '👑 秀人';
          badgeColor = 'bg-amber-400/20 text-amber-300 border-amber-400/30';
        } else if (item.category === '其他平台') {
          badgeLabel = '📦 綜合合集';
          badgeColor = 'bg-purple-500/20 text-purple-300 border-purple-500/30';
        }

        const coverSrc = item.cover_url || '';
        const chName = item.source_channel_name || '精品收藏';

        const coverHtml = coverSrc ? `
          <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden mb-2 bg-slate-900 shadow-inner">
            <img src="${coverSrc}" 
                 alt="${item.title}" 
                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
                 loading="lazy"
                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-slate-800 text-xs text-zinc-500 font-bold\\'>📦 PikPak 原檔合集</div>';" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/20"></div>
            <span class="absolute top-1.5 left-1.5 text-[9px] font-bold ${badgeColor} backdrop-blur-md px-1.5 py-0.5 rounded border">
              ${badgeLabel}
            </span>
            <span class="absolute top-1.5 right-1.5 text-[9px] text-zinc-300 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded border border-white/10">
              ${chName}
            </span>
            <span class="absolute bottom-1.5 right-1.5 text-[9px] text-blue-200 bg-blue-950/80 backdrop-blur-md px-1.5 py-0.5 rounded font-mono border border-blue-500/30">
              ${item.video_count > 0 ? `🎬 ${item.video_count}部` : '📦 網盤合集'}
            </span>
          </div>
        ` : `
          <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden mb-2 bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 flex items-center justify-center border border-white/5 shadow-inner">
            <span class="text-2xl">📦</span>
            <span class="absolute top-1.5 left-1.5 text-[9px] font-bold ${badgeColor} backdrop-blur-md px-1.5 py-0.5 rounded border">
              ${badgeLabel}
            </span>
          </div>
        `;

        // 標籤前兩枚
        const tagsPreview = (item.tags || []).slice(0, 2).map(t => 
          `<span class="text-[9px] text-zinc-400 bg-white/5 px-1 rounded">${t}</span>`
        ).join(' ');

        card.innerHTML = `
          <div>
            ${coverHtml}
            <h3 class="text-xs font-bold text-white mb-1 line-clamp-1 leading-snug group-hover:text-blue-400 transition-colors">${item.title}</h3>
            <p class="text-[10px] text-zinc-400 line-clamp-1 mb-1.5">${item.description || item.raw_text || ''}</p>
            <div class="flex flex-wrap gap-1 mb-1">${tagsPreview}</div>
          </div>
          <div class="pt-1.5 border-t border-white/5 flex items-center justify-between">
            <span class="text-[9px] text-zinc-500">${item.blogger || '精選'}</span>
            <span class="text-[10px] font-bold text-blue-400 flex items-center gap-0.5">
              <span>☁️</span> 轉存網盤
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openDetail(item) {
      haptic();
      currentActiveItem = item;

      // 封面大圖與多圖切換
      const modalCover = document.getElementById('modalCover');
      const dotsContainer = document.getElementById('modalGalleryDots');
      const images = item.images && item.images.length > 0 ? item.images : (item.cover_url ? [item.cover_url] : []);
      
      dotsContainer.innerHTML = '';
      if (images.length > 0) {
        modalCover.src = images[0];
        if (images.length > 1) {
          images.forEach((img, idx) => {
            const dot = document.createElement('button');
            dot.className = `w-2 h-2 rounded-full ${idx === 0 ? 'bg-blue-500' : 'bg-white/40'} transition-all`;
            dot.onclick = () => {
              modalCover.src = img;
              dotsContainer.querySelectorAll('button').forEach((b, i) => {
                b.className = `w-2 h-2 rounded-full ${i === idx ? 'bg-blue-500' : 'bg-white/40'} transition-all`;
              });
            };
            dotsContainer.appendChild(dot);
          });
        }
      } else {
        modalCover.src = '';
      }

      document.getElementById('modalCategory').innerText = item.category || '精選合集';
      document.getElementById('modalChannel').innerText = `來源：${item.source_channel_name || '精品收藏'}`;
      document.getElementById('modalSpec').innerText = item.video_count > 0 ? `🎬 ${item.video_count}部影片 + ${item.photo_count}張寫真` : '📦 官方無碼合集';
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalBlogger').innerText = `博主：${item.blogger}`;
      document.getElementById('modalTime').innerText = item.created_at || '最新上架';
      
      // 貼文內文
      document.getElementById('modalRawText').innerText = item.raw_text || item.description || '暫無額外看點描述';
      document.getElementById('modalCode').innerText = item.pikpak_code || item.blogger;

      // 更新 PikPak 網址顯示框
      const pikpakLink = document.getElementById('modalPikPakLink');
      if (item.pikpak_url) {
        pikpakLink.href = item.pikpak_url;
        pikpakLink.innerText = item.pikpak_url;
      } else {
        pikpakLink.removeAttribute('href');
        pikpakLink.innerText = '此合集未提供外鏈網址';
      }

      document.getElementById('btnCopyUrlDirect').onclick = () => {
        haptic();
        if (item.pikpak_url) {
          navigator.clipboard.writeText(item.pikpak_url).then(() => {
            showToast('已複製 PikPak 直連網址！');
          });
        }
      };

      // 標籤渲染（點擊可直接觸發全庫篩選）
      const tagsContainer = document.getElementById('modalTags');
      tagsContainer.innerHTML = (item.tags || []).map(t => 
        `<button onclick="filterByTagFromModal('${t}')" class="text-[11px] px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-300 border border-blue-500/20 hover:bg-blue-500/30 transition-colors">${t}</button>`
      ).join('');

      // 按鈕事件綁定
      document.getElementById('btnPikPakDirect').onclick = () => {
        haptic();
        if (item.pikpak_url) {
          showToast('正在開啟 PikPak 雲端轉存...');
          setTimeout(() => {
            window.open(item.pikpak_url, '_blank');
          }, 300);
        } else {
          showToast('此項目未提供直接轉存網址');
        }
      };

      document.getElementById('btnCopyUrl').onclick = () => {
        haptic();
        if (item.pikpak_url) {
          navigator.clipboard.writeText(item.pikpak_url).then(() => {
            showToast('已複製 PikPak 直連網址！');
          });
        }
      };

      document.getElementById('btnCopyCode').onclick = () => {
        haptic();
        const code = item.pikpak_code || item.blogger;
        navigator.clipboard.writeText(code).then(() => {
          showToast(`已複製提取碼「${code}」！`);
        });
      };

      document.getElementById('btnCopyText').onclick = () => {
        haptic();
        const text = item.raw_text || item.description || '';
        navigator.clipboard.writeText(text).then(() => {
          showToast('已複製貼文完整內文！');
        });
      };

      document.getElementById('btnJisouSearch').onclick = () => {
        haptic();
        const kw = item.blogger || item.title;
        window.open(`https://t.me/jisou2?start=a_1251504388`, '_blank');
      };

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function filterByTagFromModal(tag) {
      closeModal();
      currentTag = tag;
      
      // 更新標籤欄狀態
      const tagContainer = document.getElementById('tagPills');
      let found = false;
      tagContainer.querySelectorAll('.tag-chip').forEach(b => {
        if (b.getAttribute('data-tag').toLowerCase() === tag.toLowerCase()) {
          b.className = 'tag-chip active px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/20 text-white flex-shrink-0';
          found = true;
        } else {
          b.className = 'tag-chip px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 hover:text-white';
        }
      });
      if (!found) {
        // 如果不在前 15 標籤中，直接在搜尋框填入
        document.getElementById('searchInput').value = tag;
        document.getElementById('clearSearch').classList.remove('hidden');
      }
      renderGrid();
    }

    function closeModal() {
      haptic();
      document.getElementById('detailModal').classList.add('hidden');
    }

    document.getElementById('closeModal').onclick = closeModal;
    document.getElementById('detailModal').onclick = (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    };

    // 平台分類按鈕切換
    document.querySelectorAll('.cat-pill').forEach(pill => {
      pill.onclick = () => {
        haptic();
        document.querySelectorAll('.cat-pill').forEach(p => {
          p.className = 'cat-pill px-3 py-1 rounded-full text-xs font-medium bg-[#131b2e] text-zinc-400 border border-brand-border flex-shrink-0 flex items-center gap-1';
        });
        pill.className = 'cat-pill active px-3 py-1 rounded-full text-xs font-bold bg-blue-600 text-white shadow-md shadow-blue-600/30 flex-shrink-0 flex items-center gap-1';
        currentCategory = pill.getAttribute('data-cat');
        renderGrid();
      };
    });

    // 搜尋輸入監聽
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearch');
    searchInput.oninput = () => {
      if (searchInput.value.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderGrid();
    };

    clearBtn.onclick = () => {
      haptic();
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderGrid();
    };

    // 初始載入
    loadCatalog();
  </script>
</body>
</html>
